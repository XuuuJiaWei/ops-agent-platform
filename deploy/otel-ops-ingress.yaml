apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: otel-ops-public
  namespace: otel-demo
  annotations:
    cert.gardener.cloud/purpose: managed
    dns.gardener.cloud/class: garden
    dns.gardener.cloud/dnsnames: prometheus-otel.example.com,jaeger-otel.example.com,opensearch-otel.example.com
    dns.gardener.cloud/ttl: "300"
    nginx.ingress.kubernetes.io/auth-type: basic
    nginx.ingress.kubernetes.io/auth-secret: otel-demo-basic-auth
    nginx.ingress.kubernetes.io/auth-realm: Authentication Required - OpenTelemetry Ops
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
spec:
  ingressClassName: nginx
  tls:
    - secretName: otel-ops-public-tls
      hosts:
        - prometheus-otel.example.com
        - jaeger-otel.example.com
        - opensearch-otel.example.com
  rules:
    - host: prometheus-otel.example.com
      http:
        paths:
          - path: /mcp
            pathType: Prefix
            backend:
              service:
                name: prometheus-mcp
                port:
                  number: 8080
          - path: /
            pathType: Prefix
            backend:
              service:
                name: prometheus
                port:
                  number: 9090
    - host: jaeger-otel.example.com
      http:
        paths:
          - path: /mcp
            pathType: Prefix
            backend:
              service:
                name: jaeger
                port:
                  name: mcp
          - path: /
            pathType: Prefix
            backend:
              service:
                name: jaeger
                port:
                  number: 16686
    - host: opensearch-otel.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: opensearch
                port:
                  number: 9200
