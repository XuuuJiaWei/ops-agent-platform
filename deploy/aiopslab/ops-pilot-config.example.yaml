# Benchmark-tuned ops_pilot configuration for the AIOpsLab eval (non-secret).
#
# Copy to config/config.yaml on a fresh restore and adjust the model section
# and the observer kubeconfig path. Secrets stay in .env (key list in
# RUNBOOK.md). See deploy/aiopslab/RUNBOOK.md for the full restore procedure.
#
# The only MCP server the current AIOpsLab benchmark needs is `kubernetes`,
# pointed at the read-only observer kubeconfig (no configmaps -> flagd stays
# invisible). jaeger/prometheus/opensearch are the released otel-demo stack
# endpoints and are kept optional until AIOpsLab observability is exposed.

app_env: local
assistant_id: agent

model:
  # openai/deepseek free tier is rate-limited (429); use a paid model or the
  # sap provider with real AICORE_* credentials instead.
  provider: openai
  model_name: deepseek-v4-flash-free
  temperature: 0.0
  top_p: null
  max_tokens: 32768
  request_timeout_seconds: 120
  reasoning:
    mode: disabled
    effort: medium
  # OpenAI-compatible API ROOT (the client appends /chat/completions itself).
  base_url: https://opencode.ai/zen/v1

system_prompt: null
skills_paths: [./skills]

langfuse:
  base_url: https://jp.cloud.langfuse.com
  timeout_seconds: 30

server:
  chat_base_path: /chat
  chat_host: 127.0.0.1
  chat_port: 8123
  a2a_base_path: /a2a

persistence:
  # memory: benchmark runs don't need durable checkpoints, and psycopg async
  # cannot run on Windows' ProactorEventLoop (postgres backend would crash).
  backend: memory
  setup_on_start: true

reliability:
  enabled: true
  run_deadline_seconds: 600
  model_call_limit: 50
  tool_call_limit: 200
  recursion_limit: 9999
  tool_retry_max_retries: 2
  tool_retry_initial_delay_seconds: 0.25
  tool_retry_backoff_factor: 2.0
  tool_retry_max_delay_seconds: 60
  tool_retry_jitter: true

open_sandbox:
  enabled: null
  domain: opensandbox.${OTEL_SHOOT_DOMAIN}
  protocol: https
  use_server_proxy: true
  disable_metrics: true
  image: python:3.11
  timeout_seconds: 600
  ready_timeout_seconds: 240
  cpu_limit: 250m
  memory_limit: 256Mi
  cpu_request: 100m
  memory_request: 128Mi
  scope: thread
  max_active: 16
  workspace_path: /workspace
  internal_root: /workspace/.ops-pilot

mcpServers:
  kubernetes:
    required: true
    transport: stdio
    command: npx
    read_timeout_seconds: 60
    args:
      - -y
      - kubernetes-mcp-server@latest
      - --disable-multi-cluster
      - --kubeconfig
      - C:/Users/<you>/.kube/ops-pilot-observer.kubeconfig
    cwd: .
    allow_tools: []
    hitl_tools:
      - pods_delete
      - pods_exec
      - pods_run
      - resources_create_or_update
      - resources_delete
      - resources_scale
    retry_tools: []
    env:
      KUBECONFIG: C:/Users/<you>/.kube/ops-pilot-observer.kubeconfig
  jaeger:
    required: false
    transport: streamable_http
    url: https://jaeger-otel.${OTEL_SHOOT_DOMAIN}/mcp
    timeout: 90
    read_timeout_seconds: 30
    headers:
      Authorization: ${MCP_BASIC_AUTH_HEADER}
    allow_tools: []
    hitl_tools: []
    retry_tools:
      - get_critical_path
      - get_service_dependencies
      - get_services
      - get_span_details
      - get_span_names
      - get_trace_errors
      - get_trace_topology
      - search_traces
  prometheus:
    required: false
    transport: streamable_http
    url: https://prometheus-otel.${OTEL_SHOOT_DOMAIN}/mcp
    timeout: 90
    read_timeout_seconds: 30
    headers:
      Authorization: ${MCP_BASIC_AUTH_HEADER}
    allow_tools: []
    hitl_tools: []
    retry_tools: []
  opensearch:
    required: false
    transport: stdio
    command: uvx
    args: ["opensearch-mcp-server-py@0.11.0", "--log-format", "json"]
    cwd: .
    read_timeout_seconds: 60
    allow_tools: []
    hitl_tools:
      - GenericOpenSearchApiTool
    retry_tools:
      - ListIndexTool
      - IndexMappingTool
      - SearchIndexTool
      - GetShardsTool
      - PPLQueryTool
    env:
      OPENSEARCH_URL: https://opensearch-otel.${OTEL_SHOOT_DOMAIN}
      OPENSEARCH_USERNAME: ${OTEL_BASIC_AUTH_USER}
      OPENSEARCH_PASSWORD: ${OTEL_BASIC_AUTH_PASSWORD}
      OPENSEARCH_ENABLED_TOOLS: ListIndexTool,IndexMappingTool,SearchIndexTool,GetShardsTool,GenericOpenSearchApiTool,PPLQueryTool
      OPENSEARCH_SETTINGS_ALLOW_WRITE: "false"
