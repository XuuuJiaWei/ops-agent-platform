[server]
host = "0.0.0.0"
port = 8090

[log]
level = "INFO"

[runtime]
type = "docker"
execd_image = "sandbox-registry.cn-zhangjiakou.cr.aliyuncs.com/opensandbox/execd:v1.0.22"

[docker]
network_mode = "bridge"
# The server runs in a container while sandbox ports are published on the host.
host_ip = "host.docker.internal"
port_range_min = 40000
port_range_max = 60000
drop_capabilities = ["AUDIT_WRITE", "MKNOD", "NET_ADMIN", "NET_RAW", "SYS_ADMIN", "SYS_MODULE", "SYS_PTRACE", "SYS_TIME", "SYS_TTY_CONFIG"]
no_new_privileges = true
pids_limit = 4096

[ingress]
mode = "direct"

[store]
type = "sqlite"
path = "/var/lib/opensandbox/opensandbox.db"
