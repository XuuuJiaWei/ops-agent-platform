# Overrides for opentelemetry-demo chart 0.41.0 / app 3.0.0.
# Chart defaults provide the demo; this file records only our deliberate changes.
jaeger:
  userconfig:
    extensions:
      jaeger_mcp:
        http:
          endpoint: 0.0.0.0:16687
        server_name: jaeger
        max_span_details_per_request: 20
        max_search_results: 20
    service:
      extensions:
        - jaeger_storage
        - jaeger_query
        - healthcheckv2
        - jaeger_mcp
  jaeger:
    service:
      extraPorts:
        - name: mcp
          port: 16687
          targetPort: 16687
          protocol: TCP
          appProtocol: http

# The demo's default 7-day in-memory TSDB exceeds its 400Mi limit under the
# bundled load generator. Six hours is ample for the RCA eval windows and keeps
# this disposable Shoot stable.
prometheus:
  server:
    retention: 6h
    resources:
      requests:
        memory: 512Mi
      limits:
        memory: 1Gi
