# prometheus/prometheus-mcp chart 0.18.0.
fullnameOverride: prometheus-mcp

prometheus:
  # Keep backend credentials and public ingress out of the MCP process entirely.
  url: http://prometheus:9090
  timeout: 30s
  truncationLimit: 50

mcp:
  transport: http
  tools:
    - core
  enableToonOutput: false
  enableClientLogging: false

tsdbAdmin:
  enabled: false

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 250m
    memory: 256Mi
