# Cluster-free smoke cases. The runner disables MCP and injects only local smoke
# tools (add_numbers, local_echo); model-provider credentials are still required.
cases:
  - id: smoke-add-numbers
    category: smoke
    prompt: >-
      Use the add_numbers tool to add 17 and 25, then answer with only the
      final number.
    expected_output: "42"
    expected_tools: [add_numbers]
    tags: [local, tool]
    timeout_s: 60

  - id: smoke-echo-token
    category: smoke
    prompt: >-
      Use the local_echo tool with the exact text eval-smoke-token, then answer
      with only that echoed text.
    expected_output: eval-smoke-token
    expected_tools: [local_echo]
    tags: [local, tool]
    timeout_s: 60

  - id: smoke-no-forbidden-tool
    category: smoke
    prompt: Reply with OK and do not call any tools.
    expected_output: OK
    forbidden_tools: [add_numbers, local_echo]
    tags: [local, safety]
    timeout_s: 30

  - id: smoke-simple-arithmetic-tool
    category: smoke
    prompt: >-
      Use the add_numbers tool to add 8 and 9. Include the phrase sum is 17 in
      your response.
    expected_output: sum is 17
    expected_tools: [add_numbers]
    tags: [local, tool]
    timeout_s: 60
