# Diagnosis chaos cases — run with `chaos run --cases-dir eval/cases/chaos/`.
#
# Each case requires exactly ONE flagd fault flag to be active in the cluster.
# `chaos run` handles injection automatically: reset → inject → verify → run agent → restore.
# NEVER run these with `eval run` — without injection there is no signal and
# scores are meaningless.
#
# The `inject` field is GROUND TRUTH for the judge only. It NEVER reaches the
# agent's prompt; the agent must discover the fault from observable signals.
#
# The runner enables exactly one flag per case and restores it transactionally.
# HITL tools are forbidden dynamically from config/config.yaml; do not duplicate
# that policy in every item because it will drift when the MCP config changes.

cases:
  - id: otel-payment-failure-charge
    category: diagnosis
    source: synthetic
    version: "2026-08"
    prompt: >-
      PagerDuty alert: checkout conversion has dropped and customers report that
      payment sometimes fails when they place an order. Investigate the charge
      path, identify which service is returning errors on charge requests, and
      estimate what fraction of charge attempts are failing.
    expected_output: payment
    expected_tools: [search_traces]
    rubric: >-
      Pass if the answer names the payment service as the failing component on
      charge requests, cites trace/error evidence (error spans on the charge
      operation), and estimates a failure fraction over an explicitly stated
      observed sample/window. Ground truth: flagd flag
      `paymentFailure` at a percentage variant (e.g. 50%). Fail if it blames an
      unrelated service or claims it applied a fix.
    tags: [otel, jaeger, diagnosis, paymentFailure]
    timeout_s: 300
    inject: {flag: paymentFailure, variant: "50%"}

  - id: otel-payment-unreachable
    category: diagnosis
    source: synthetic
    version: "2026-08"
    prompt: >-
      Incident: orders are no longer completing and current checkout errors say
      one downstream dependency cannot be reached. Determine which dependency
      is unavailable and show the evidence for it.
    expected_output: payment
    expected_tools: [search_traces]
    rubric: >-
      Pass if the answer identifies the payment service as unavailable/unreachable
      from checkout, distinguishes an unreachable dependency (connection-level
      failure) from a percentage error rate, and cites trace evidence. Ground
      truth: flagd flag `paymentUnreachable=on`.
    tags: [otel, jaeger, diagnosis, paymentUnreachable]
    timeout_s: 300
    inject: {flag: paymentUnreachable, variant: "on"}

  - id: otel-product-catalog-failure
    category: diagnosis
    source: synthetic
    version: "2026-08"
    prompt: >-
      Support tickets say some product pages return errors while most load fine.
      Find the service behind the product listings, confirm whether it is
      failing, and describe the failure pattern.
    expected_output: catalog
    expected_tools: [search_traces]
    rubric: >-
      Pass if the answer identifies the product catalog service as failing, notes
      the failure is scoped to a specific product / subset of requests rather
      than a total outage, and grounds this in trace/error data. Ground truth:
      flagd flag `productCatalogFailure=on`.
    tags: [otel, jaeger, diagnosis, productCatalogFailure]
    timeout_s: 300
    inject:
      flag: productCatalogFailure
      variant: "on"
      target: {product_id: OLJCESPC7Z}

  - id: otel-cart-failure-rate
    category: diagnosis
    source: synthetic
    version: "2026-08"
    prompt: >-
      Users report that adding items to the cart works sometimes and fails other
      times. Identify the failing service, estimate its failure rate from the
      recent requests you can observe, and state the sample/window used.
    expected_output: cart
    expected_tools: [search_traces]
    rubric: >-
      Pass if the answer identifies the cart service as intermittently failing (a
      percentage of requests), includes a time window, and uses metric or trace
      evidence rather than guessing. Ground truth: flagd flag `cartFailure` at a
      percentage variant.
    tags: [otel, jaeger, diagnosis, cartFailure]
    timeout_s: 300
    inject: {flag: cartFailure, variant: "50%"}

  - id: otel-ad-high-cpu
    category: diagnosis
    source: synthetic
    version: "2026-08"
    prompt: >-
      Alert: ad requests are currently slow while the rest of the storefront is
      responsive. Localize the bottleneck and use telemetry to distinguish
      resource pressure from downstream errors.
    expected_tools: [query]
    rubric: >-
      Pass if the answer checks CPU utilization for the ad service, concludes CPU
      saturation is the driver, and cites a metric trend. Ground truth: flagd
      flag `adHighCpu=on`. Fail if it recommends restarting/scaling without
      evidence, or ignores CPU entirely.
    tags: [otel, prometheus, diagnosis, adHighCpu]
    timeout_s: 300
    inject: {flag: adHighCpu, variant: "on"}

  - id: otel-image-slow-load
    category: diagnosis
    source: synthetic
    version: "2026-08"
    prompt: >-
      Users complain the storefront home page feels sluggish and product images
      take a long time to appear, though the page eventually loads. Identify
      where the latency is introduced and quantify it.
    expected_output: image
    expected_tools: [search_traces]
    rubric: >-
      Pass if the answer localizes the latency to slow image loading in the
      frontend (not a backend service failure), gives an approximate added
      delay, and separates observation from hypothesis. Ground truth: flagd flag
      `imageSlowLoad` (5sec/10sec variant).
    tags: [otel, jaeger, diagnosis, imageSlowLoad]
    timeout_s: 300
    inject: {flag: imageSlowLoad, variant: "10sec"}

  - id: otel-kafka-queue-problems
    category: diagnosis
    source: synthetic
    version: "2026-08"
    prompt: >-
      Downstream order processing is lagging and confirmations are delayed.
      Investigate the message queue path and explain whether there is a backlog
      and a consumer-side processing delay.
    expected_output: kafka
    expected_tools: [search_traces]
    rubric: >-
      Pass if the answer identifies Kafka queue overload combined with a consumer
      side delay, references backlog/lag or elongated spans, and traces the
      impact downstream. Ground truth: flagd flag `kafkaQueueProblems=on`.
    tags: [otel, jaeger, diagnosis, kafkaQueueProblems]
    timeout_s: 300
    inject: {flag: kafkaQueueProblems, variant: "on"}

  - id: otel-recommendation-cache-failure
    category: diagnosis
    source: synthetic
    version: "2026-08"
    prompt: >-
      Alert: recommendation responses are slowing down and current telemetry
      shows elevated memory usage. Investigate the cause.
    expected_output: recommendation
    expected_tools: [query]
    rubric: >-
      Pass if the answer connects a recommendation-service cache problem to
      growing memory usage, cites a memory metric trend, and avoids claiming a
      fix was applied. Ground truth: flagd flag `recommendationCacheFailure=on`.
    tags: [otel, prometheus, diagnosis, recommendationCacheFailure]
    timeout_s: 300
    inject: {flag: recommendationCacheFailure, variant: "on"}

  - id: otel-ad-service-failure
    category: diagnosis
    source: synthetic
    version: "2026-08"
    prompt: >-
      The storefront still supports browsing and checkout, but ad requests are
      intermittently returning errors. Identify the failing component, describe
      the observed error pattern, and support the conclusion with traces.
    expected_output: ad
    expected_tools: [search_traces]
    rubric: >-
      Pass if the answer identifies the ad service as the failing component,
      cites error spans or failed ad operations, and distinguishes the failure
      from a latency-only or CPU-pressure incident. Ground truth: flagd flag
      `adFailure=on`.
    tags: [otel, jaeger, diagnosis, adFailure]
    timeout_s: 300
    inject: {flag: adFailure, variant: "on"}

  - id: otel-ad-manual-gc
    category: diagnosis
    source: synthetic
    version: "2026-08"
    prompt: >-
      Ad responses show recurring latency pauses without a matching downstream
      outage. Investigate the ad service runtime and explain the most likely
      source of the pauses using current telemetry.
    expected_output: ad
    expected_tools: [query]
    rubric: >-
      Pass if the answer localizes the incident to the ad service and connects
      recurring pauses to unusually frequent/manual garbage collection using
      runtime or latency evidence. It must not misclassify the incident as the
      separate sustained-CPU fault. Ground truth: flagd flag `adManualGc=on`.
    tags: [otel, prometheus, diagnosis, adManualGc]
    timeout_s: 300
    inject: {flag: adManualGc, variant: "on"}

  - id: otel-email-memory-leak
    category: diagnosis
    source: synthetic
    version: "2026-08"
    prompt: >-
      After order traffic runs for a while, one notification-path service shows
      rapidly increasing memory consumption. Identify the service and explain
      the evidence for a leak rather than a one-time allocation spike.
    expected_output: email
    expected_tools: [query]
    rubric: >-
      Pass if the answer identifies the email service, cites a sustained memory
      growth pattern during the observed incident window, and explains why the
      pattern is consistent with a leak. Ground truth: flagd flag
      `emailMemoryLeak=100x`.
    tags: [otel, prometheus, diagnosis, emailMemoryLeak]
    timeout_s: 300
    inject: {flag: emailMemoryLeak, variant: "100x"}

  - id: otel-cart-readiness-failure
    category: diagnosis
    source: synthetic
    version: "2026-08"
    prompt: >-
      Kubernetes reports that a workload in the otel-demo namespace is not
      ready even though most storefront pods are running. Identify the affected
      service and correlate pod readiness with recent warning events.
    expected_output: cart
    expected_tools: [pods_list_in_namespace, events_list]
    rubric: >-
      Pass if the answer identifies the cart service/pod as failing readiness,
      cites pod condition and warning-event evidence, and does not claim the
      workload was restarted or repaired. Ground truth: flagd flag
      `failedReadinessProbe=on`.
    tags: [otel, kubernetes, diagnosis, failedReadinessProbe]
    timeout_s: 300
    inject: {flag: failedReadinessProbe, variant: "on"}

  - id: otel-international-shipping-slowdown
    category: diagnosis
    source: synthetic
    version: "2026-08"
    prompt: >-
      Checkout latency is normal for domestic orders but much higher for
      international destinations. Trace the slow path, identify the affected
      service, and estimate the added delay.
    expected_output: shipping
    expected_tools: [search_traces]
    rubric: >-
      Pass if the answer localizes the added latency to international shipping,
      distinguishes it from payment or total checkout failure, and estimates an
      approximately ten-second delay from trace evidence. Ground truth: flagd
      flag `intlShippingSlowdown=10sec`.
    tags: [otel, jaeger, diagnosis, intlShippingSlowdown]
    timeout_s: 300
    inject: {flag: intlShippingSlowdown, variant: "10sec"}
