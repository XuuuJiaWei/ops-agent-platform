[project]
name = "ops_pilot"
version = "0.1.0"
description = "ops_pilot DeepAgents backend for SAP AI Core with Chat and A2A protocol surfaces"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "a2a-sdk[http-server,postgresql]>=1.1.2,<2",
  "ag-ui-langgraph>=0.0.42,<1",
  "copilotkit>=0.1.74,<1",
  "deepagents>=0.7.1,<1",
  "deepagents-opensandbox>=1.0.1,<2",
  "fastapi>=0.141.1,<1",
  "jmespath>=1.0.1,<2",
  "langchain>=1.3.14,<2",
  "langchain-core>=1.5.3,<2",
  "langchain-mcp-adapters>=0.3.1,<1",
  "langfuse>=4.14.2,<5",
  "langgraph>=1.2.10,<2",
  "langgraph-checkpoint-postgres>=3.1,<4",
  "mcp>=1.29.0,<2",
  "opensandbox>=0.1.15,<0.2",
  "psycopg[binary,pool]>=3.2,<4",
  "pydantic-settings>=2.14.2,<3",
  "python-dotenv>=1.2.1,<2",
  "pyyaml>=6.0.2,<7",
  "sap-ai-sdk-gen[amazon]>=7.2.0,<8",
  "uvicorn>=0.52.0,<1",
  "websockets>=15.0.1,<16",
]

[dependency-groups]
dev = [
  "pytest>=9.0.2,<10",
  "pytest-asyncio>=1.3.0,<2",
  "ruff>=0.14.8,<1",
]

[project.scripts]
ops_pilot = "ops_pilot.cli.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
package = true

[tool.hatch.build.targets.wheel]
packages = ["src/ops_pilot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 120
indent-width = 4
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
fixable = ["ALL"]
unfixable = []
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
docstring-code-format = false
docstring-code-line-length = "dynamic"
