# ── Runtime 组合配置（模板 / 文档）────────────────────────────────
# 三层模型：
#   1. 顶层键（deepagent / observability / server / web / benchmark）是
#      所有 entrypoint 共享的默认值。
#   2. entrypoints.<name> 只写「真实差异」，深合并覆盖到顶层默认之上。
#   3. 密钥一律走仓库根 .env（LANGFUSE_* / DEEPSEEK_API_KEY / DATABASE_URL…），
#      本文件出现任何 secret 都会被拒绝加载。
#
# 用法：复制为 runtime.yaml 后按需修改。标注 [default] 的键可直接删除，
# 行为与默认值一致；完整 schema 见 services/platform/.../environment.py。
# system-prompt 支持内联文本或 prompt 文件路径（*.md/*.txt，相对仓库根）。
---
deepagent:
  # system-prompt: 内联文本或 config/prompts/*.md 路径（默认无；示例见 rca100）
  model:
    provider: sap                          # [required] 默认 sap
    name: anthropic--claude-4.6-sonnet     # [required] 默认模型
    base-url: null                         # [default] null=走 provider 内置端点
    temperature: 0.0                       # [default]
    max-tokens: 16384                      # [default]
    timeout-seconds: 120                   # [default]
    reasoning:
      mode: adaptive                       # [default] disabled | adaptive
      effort: medium                       # [default] low | medium | high
  tools:
    mcp:
      kubernetes: {}                       # [default] kubeconfig 默认 null → in-cluster
      jaeger: {}                           # [default] url 默认 null（关闭）
      prometheus: {}                       # [default] url 默认 null（关闭）
  skills: []                               # [default] 技能目录列表
  memory: []                               # [default] 语义记忆文件列表
  permissions: []                          # [default] 文件系统权限规则
  middleware:
    todo-list: false                       # [default]
    filesystem:
      tools: null                          # [default] null=DeepAgents 默认工具面
    reliability:
      enabled: false                       # [default] 运行时限/调用上限
  backend:
    type: state                            # [default] state | opensandbox
  interrupt-on: {}                         # [default] 需人工确认的动作
  checkpointer:
    backend: none                          # [default] none | memory | postgres
  debug: false                             # [default]
observability:
  enabled: false                           # [default] true=启用 tracing 上报
  environment: local                       # [default]
  langfuse:
    base-url: https://cloud.langfuse.com   # [override] 本地自托管用 http://localhost:3001
    timeout-seconds: 30                    # [default]
  logging:
    enabled: false                         # [default]
    level: INFO                            # [default]
    payloads: metadata                     # [default] metadata | preview
    max-preview-chars: 500                 # [default]

entrypoints:
  # 每个 entrypoint 只写真实差异，其余继承顶层默认（深合并）。
  web:
    deepagent:
      name: agent                           # [override]
      middleware:
        todo-list: true                     # [override] 默认 false
        filesystem:
          tools:
            - read_file                     # [override] 默认 DeepAgents 全部工具
            - ls
            - glob
            - grep
      checkpointer:
        backend: memory                     # [override] 默认 none
    # server / web 顶层块通常无需覆盖（均为默认值）：
    #   server: {host: 127.0.0.1, port: 8123, chat: {base-path: /chat},
    #            a2a: {base-path: /a2a, enabled: true}}
    #   web: {spaces: {enabled: true}, frontend: {port: 3000},
    #         copilot-runtime: {host: 127.0.0.1, port: 4001,
    #                            base-path: /api/copilotkit,
    #                            event-store-backend: memory,
    #                            event-store-setup-on-start: true}}

  eval:
    deepagent:
      name: ops-pilot-eval                  # [override]

  benchmark:
    deepagent:
      name: ops-pilot-benchmark             # [override]
    benchmark:
      aiopslab:
        # directory: D:/path/to/AIOpsLab    # [override] 基准数据集检出路径，默认 null

  rca100:
    observability:
      logging:
        payloads: preview                   # [override] 例：preview 日志
    deepagent:
      name: ops-pilot-sre-diagnosis         # [override]
      system-prompt: config/prompts/sre-system.md   # [override] 指向 prompt 文件
      skills: []                            # [override] 覆盖顶层 [skills]

  langgraph:
    deepagent:
      name: ops-pilot-langgraph             # [override]
