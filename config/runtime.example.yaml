# Non-sensitive default runtime composition with small entrypoint overrides.
# Copy this file to runtime.yaml for local changes. Credentials belong in .env.
deepagent:
  model:
    provider: openai
    name: openai/gpt-5-nano
    base-url: https://openrouter.ai/api/v1
    temperature: 0.0
    max-tokens: 16384
    timeout-seconds: 120
    reasoning:
      mode: adaptive
      effort: medium
  tools:
    mcp:
      kubernetes:
        kubeconfig: null
      jaeger:
        url: null
      prometheus:
        url: null
  skills:
    - skills
  memory: []
  permissions: []
  middleware:
    todo-list: false
    filesystem:
      tools: null
    reliability:
      enabled: true
      run-deadline-seconds: 600
      model-call-limit: 50
      tool-call-limit: 200
      recursion-limit: 256
  backend:
    type: state
  interrupt-on: {}
  checkpointer:
    backend: none
  debug: false
observability:
  environment: local

entrypoints:
  web:
    deepagent:
      name: agent
      middleware:
        todo-list: true
        filesystem:
          tools:
            - read_file
            - ls
            - glob
            - grep
      checkpointer:
        backend: memory
        setup-on-start: true
    server:
      host: 127.0.0.1
      port: 8123
      chat:
        base-path: /chat
      a2a:
        base-path: /a2a
        enabled: true
    web:
      spaces:
        enabled: true
      frontend:
        port: 3000
      copilot-runtime:
        host: 127.0.0.1
        port: 4001
        base-path: /api/copilotkit
        event-store-backend: memory
        event-store-setup-on-start: true

  eval:
    deepagent:
      name: ops-pilot-eval

  benchmark:
    deepagent:
      name: ops-pilot-benchmark
    benchmark:
      aiopslab:
        directory: null

  rca100:
    deepagent:
      name: ops-pilot-sre-diagnosis
      tools:
        mcp:
          kubernetes:
            kubeconfig: null
          jaeger:
            url: null
          prometheus:
            url: null
      skills: []
      memory: []
      permissions: []
      middleware:
        todo-list: false
        filesystem:
          tools: null
        reliability:
          enabled: true
          run-deadline-seconds: 600
          model-call-limit: 50
          tool-call-limit: 200
          recursion-limit: 256
      checkpointer:
        backend: none

  langgraph:
    deepagent:
      name: ops-pilot-langgraph
