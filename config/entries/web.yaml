# Web entrypoint. Keep credentials in the repository .env, never in this file.
model:
  provider: deepseek
  name: deepseek-v4-pro
  base-url: https://api.deepseek.com
  temperature: 0.0
  max-tokens: 16384
  timeout-seconds: 120
  reasoning:
    mode: adaptive
    effort: medium

# The backend tool catalog. Browser-only CopilotKit tools stay in React source.
tools:
  mcp:
    kubernetes:
      kubeconfig: null
    jaeger:
      url: null
    prometheus:
      url: null

system-prompt: null
skills:
  - skills
memory: []
permissions: []

# Official DeepAgents middleware plus this host's reliability middleware.
middleware:
  todo-list: false
  filesystem:
    tools: null
  reliability:
    enabled: true
    run-deadline-seconds: 600
    model-call-limit: 50
    tool-call-limit: 200

# state selects DeepAgents' default StateBackend. Use opensandbox only when
# OPEN_SANDBOX_API_KEY is present in .env.
backend:
  type: state
  opensandbox:
    domain: null
    protocol: https
    use-server-proxy: true
    image: python:3.11
    timeout-seconds: 600
    ready-timeout-seconds: 240
    scope: thread

# Map tool names directly to create_deep_agent(interrupt_on=...).
interrupt-on: {}
checkpointer:
  backend: memory
  setup-on-start: true
debug: false
name: agent

observability:
  environment: local
  langfuse:
    base-url: https://cloud.langfuse.com
    timeout-seconds: 30

# Host transport, not agent capability. It remains entrypoint-local.
server:
  host: 127.0.0.1
  port: 8123
  chat:
    base-path: /chat
  a2a:
    base-path: /a2a
    enabled: true
web:
  spaces:
    enabled: true
  frontend:
    port: 3000
  copilot-runtime:
    host: 127.0.0.1
    port: 4001
    base-path: /api/copilotkit
    event-store-backend: memory
    event-store-setup-on-start: true
