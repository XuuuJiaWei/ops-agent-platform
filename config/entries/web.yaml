# Web entrypoint. Credentials belong only in the repository .env.
deepagent:
  model:
    provider: deepseek
    name: deepseek-v4-pro
    base-url: https://api.deepseek.com
    temperature: 0.0
    max-tokens: 16384
    timeout-seconds: 120
    reasoning:
      mode: adaptive
      effort: medium

  # The backend tool catalog. Browser-only CopilotKit tools stay in React source.
  tools:
    mcp:
      kubernetes:
        kubeconfig: null
      jaeger:
        url: null
      prometheus:
        url: null

  # Omitted system-prompt preserves DeepAgents' built-in base prompt.
  skills:
    - skills
  memory: []
  permissions: []
  middleware:
    todo-list: true
    filesystem:
      # The official read-only FilesystemMiddleware allowlist.
      tools:
        - read_file
        - ls
        - glob
        - grep
    reliability:
      enabled: true
      run-deadline-seconds: 600
      model-call-limit: 50
      tool-call-limit: 200

  # The local OpenSandbox service listens at http://127.0.0.1:8090.
  backend:
    type: opensandbox
    opensandbox:
      domain: 127.0.0.1:8090
      protocol: http
      use-server-proxy: false
      image: python:3.11
      timeout-seconds: 600
      ready-timeout-seconds: 240
      scope: thread

  interrupt-on: {}
  checkpointer:
    backend: memory
    setup-on-start: true
  debug: false
  name: agent

observability:
  environment: local
  langfuse:
    base-url: https://cloud.langfuse.com
    timeout-seconds: 30

# Host transport, not DeepAgents harness capability. It remains entrypoint-local.
server:
  host: 127.0.0.1
  port: 8123
  chat:
    base-path: /chat
  a2a:
    base-path: /a2a
    enabled: true
web:
  spaces:
    enabled: true
  frontend:
    port: 3000
  copilot-runtime:
    host: 127.0.0.1
    port: 4001
    base-path: /api/copilotkit
    event-store-backend: memory
    event-store-setup-on-start: true
