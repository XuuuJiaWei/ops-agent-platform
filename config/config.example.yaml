# ops_pilot regular (non-secret) configuration.
#
# Copy to config/config.yaml and adjust as needed. Secrets stay in .env and are
# referenced from this file with ${VAR} only inside MCP server env blocks.

app_env: local
assistant_id: agent

sap:
  model_name: anthropic--claude-4.6-sonnet
  temperature: 0.0
  top_p: null
  max_tokens: 8192

system_prompt: null
skills_paths: [./skills]
enable_smoke_tools: true
enable_storyline_tool: false

langfuse:
  # Public/secret keys stay in .env; only the base URL is regular config.
  base_url: https://cloud.langfuse.com

server:
  chat_base_path: /chat
  chat_host: 127.0.0.1
  chat_port: 8123
  a2a_base_path: /a2a

open_sandbox:
  # null = auto-enable only when domain (here) and api_key (.env) are both set.
  enabled: null
  domain: opensandbox.example.com
  protocol: https
  use_server_proxy: true
  disable_metrics: true
  image: python:3.11
  timeout_seconds: 600
  ready_timeout_seconds: 240
  cpu_limit: 250m
  memory_limit: 256Mi
  cpu_request: 100m
  memory_request: 128Mi
  # process = one shared sandbox with logical workspaces.
  # thread = one sandbox per agent thread (default, strongest practical reuse).
  # run = one sandbox per agent run/task.
  scope: thread
  max_active: 16
  workspace_path: /workspace
  internal_root: /workspace/.ops-pilot

# MCP servers for the open-source OTel Demo ops stack. Secrets stay in .env.
# Permission lists per server:
#   allow_tools: allowlist of tool names; empty/omitted = allow all.
#   hitl_tools:  tools that require human-in-the-loop approval before running.
#   headers:     only for http/sse/streamable_http MCP transports, e.g.
#                Authorization: ${MCP_BASIC_AUTH_HEADER}
mcpServers:
  kubernetes:
    required: false
    transport: stdio
    command: npx
    timeout: 60
    args:
      - -y
      - kubernetes-mcp-server@latest
      - --read-only
      - --disable-multi-cluster
      - --kubeconfig
      - /path/to/kubeconfig-gardenlogin--cloud--shoot.yaml
    cwd: .
    allow_tools: []
    hitl_tools: []
    env:
      KUBECONFIG: /path/to/kubeconfig-gardenlogin--cloud--shoot.yaml
  prometheus:
    required: false
    transport: stdio
    command: npx
    args: ["-y", "prometheus-mcp@latest", "stdio"]
    cwd: .
    timeout: 60
    allow_tools: []
    hitl_tools: []
    env:
      PROMETHEUS_URL: http://${OTEL_BASIC_AUTH_USER}:${OTEL_BASIC_AUTH_PASSWORD}@prometheus-otel.example.com
  jaeger:
    required: false
    transport: stdio
    command: uvx
    args: ["opentelemetry-mcp", "--backend", "jaeger"]
    cwd: .
    timeout: 60
    allow_tools: []
    hitl_tools: []
    env:
      BACKEND_URL: http://${OTEL_BASIC_AUTH_USER}:${OTEL_BASIC_AUTH_PASSWORD}@jaeger-otel.example.com/jaeger/ui
  opensearch:
    required: false
    transport: stdio
    command: uvx
    args: ["opensearch-mcp-server-py"]
    cwd: .
    timeout: 90
    allow_tools:
      - ListIndexTool
      - IndexMappingTool
      - SearchIndexTool
      - GetShardsTool
      - ClusterHealthTool
      - CountTool
      - ExplainTool
      - MsearchTool
      - GenericOpenSearchApiTool
      - PPLQueryTool
    hitl_tools:
      - GenericOpenSearchApiTool
    env:
      OPENSEARCH_URL: http://opensearch-otel.example.com
      OPENSEARCH_USERNAME: ${OTEL_BASIC_AUTH_USER}
      OPENSEARCH_PASSWORD: ${OTEL_BASIC_AUTH_PASSWORD}
      OPENSEARCH_ENABLED_CATEGORIES: core_tools,observability
      OPENSEARCH_SETTINGS_ALLOW_WRITE: "false"
  # github: disabled by default; re-enable when a GitHub PAT is ready.
  # dynatrace-managed: disabled for the local open-source ops demo.
  # kibana: disabled for the local open-source ops demo.
