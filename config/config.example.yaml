# ops_pilot regular, secret-free configuration.
# Copy to config/config.yaml and add environment-specific model, MCP, sandbox,
# and persistence settings there. Secrets stay in .env.

app_env: local
assistant_id: agent

model:
  provider: sap
  model_name: anthropic--claude-4.6-sonnet
  temperature: 0.0
  top_p: null
  max_tokens: 16384
  request_timeout_seconds: 120
  reasoning:
    mode: adaptive
    effort: medium
  base_url: null

system_prompt: null
skills_paths: [./skills]

langfuse:
  base_url: https://cloud.langfuse.com
  timeout_seconds: 30

server:
  chat_base_path: /chat
  chat_host: 127.0.0.1
  chat_port: 8123
  a2a_base_path: /a2a

persistence:
  backend: memory
  setup_on_start: true

# Runtime guardrails use LangChain's official middleware.
reliability:
  enabled: true
  run_deadline_seconds: 600
  model_call_limit: 50
  tool_call_limit: 200
  tool_retry_max_retries: 2
  tool_retry_initial_delay_seconds: 0.25
  tool_retry_backoff_factor: 2.0
  tool_retry_max_delay_seconds: 60
  tool_retry_jitter: true

# Optional remote sandbox. Configure domain/API key only in the environment that
# actually provides OpenSandbox.
open_sandbox:
  enabled: false
  domain: null
  protocol: https
  use_server_proxy: true
  disable_metrics: true
  image: python:3.11
  timeout_seconds: 600
  ready_timeout_seconds: 240
  cpu_limit: 250m
  memory_limit: 256Mi
  cpu_request: 100m
  memory_request: 128Mi
  scope: thread
  max_active: 16
  workspace_path: /workspace
  internal_root: /workspace/.ops-pilot

# The default checkout has no environment-specific tools. For AIOpsLab, point a
# local config.yaml at the Kubernetes / metrics / traces tool endpoints that can
# observe the benchmark cluster.
mcpServers: {}
