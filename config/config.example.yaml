# ops_pilot regular (non-secret) configuration.
#
# Copy to config/config.yaml and adjust as needed. Secrets stay in .env and are
# referenced here with ${VAR} in MCP server url/headers/env values and
# open_sandbox.domain. Use $$ for a literal $. OTEL_SHOOT_DOMAIN is the single
# Gardener shoot identity that all otel-demo endpoints interpolate.

app_env: local
assistant_id: agent

# Model provider switch. provider selects the backend:
#   sap       = SAP Generative AI Hub proxy (default; company AI Core).
#   deepseek  = DeepSeek API (OpenAI-compatible; set base_url + MODEL_API_KEY).
#   openai / anthropic / google_genai / ollama = LangChain init_chat_model.
model:
  provider: sap
  model_name: anthropic--claude-4.6-sonnet
  # Sampling parameters are ignored while adaptive reasoning is enabled.
  temperature: 0.0
  top_p: null
  max_tokens: 16384
  # Per-model-call transport deadline; keep below the outer request/eval budget.
  request_timeout_seconds: 120
  reasoning:
    # Claude Sonnet 4.6 adaptive thinking; set mode: disabled for models that
    # do not expose reasoning output.
    mode: adaptive
    # Sonnet 4.6's recommended default for tool-heavy application workloads.
    effort: medium
  # DeepAgents installs the official provider prompt-caching middleware by default.
  # base_url only for OpenAI-compatible providers (deepseek/openai/vLLM/...).
  # DeepSeek: https://api.deepseek.com  (the API key is MODEL_API_KEY in .env)
  base_url: null

# Local DeepSeek example (uncomment to switch off SAP AI Core):
# model:
#   provider: deepseek
#   model_name: deepseek-chat
#   base_url: https://api.deepseek.com
#   max_tokens: 8192

system_prompt: null
skills_paths: [./skills]

langfuse:
  # Public/secret keys stay in .env; only the base URL is regular config.
  base_url: https://cloud.langfuse.com
  timeout_seconds: 30

server:
  chat_base_path: /chat
  chat_host: 127.0.0.1
  chat_port: 8123
  a2a_base_path: /a2a

# Durable execution: LangGraph checkpointer + A2A task store.
#   memory   = in-process only; conversations and tasks are lost on restart (dev default).
#   postgres = AsyncPostgresSaver (checkpoints) + A2A DatabaseTaskStore; set DATABASE_URL in .env.
# Start a local Postgres with `deploy/postgres` (docker compose).
persistence:
  backend: memory
  # Create tables on startup. Fine for local/dev; use a managed migration in production.
  setup_on_start: true

# Reliable agent/tool execution. Retries are bounded by the run deadline and
# are automatic only for MCP tools declared read-only/idempotent by the server
# or explicitly listed in a server's retry_tools.
reliability:
  enabled: true
  # Fallback for interactive/API runs. Eval case timeout_s overrides this value
  # through the same RunController, so there is only one effective deadline.
  run_deadline_seconds: 600
  max_attempts: 3
  initial_backoff_seconds: 0.25
  backoff_multiplier: 2.0
  jitter_ratio: 0.2

# Chaos readiness/recovery policy. Runtime changes use the official flagd-ui API;
# the Helm ConfigMap remains the safe restart baseline.
chaos:
  namespace: otel-demo
  flagd_service: flagd
  flagd_service_port: 8016
  flagd_ui_port: 4000
  flag_sync_timeout_seconds: 90
  poll_interval_seconds: 1
  stable_reads: 2
  signal_warmup_seconds: 15

open_sandbox:
  # null = auto-enable only when domain (here) and api_key (.env) are both set.
  enabled: null
  domain: opensandbox.${OTEL_SHOOT_DOMAIN}
  protocol: https
  use_server_proxy: true
  disable_metrics: true
  image: python:3.11
  timeout_seconds: 600
  ready_timeout_seconds: 240
  cpu_limit: 250m
  memory_limit: 256Mi
  cpu_request: 100m
  memory_request: 128Mi
  # process = one shared sandbox with logical workspaces.
  # thread = one sandbox per agent thread (default, strongest practical reuse).
  # run = one sandbox per agent run/task.
  scope: thread
  max_active: 16
  workspace_path: /workspace
  internal_root: /workspace/.ops-pilot

# MCP servers for the open-source OTel Demo ops stack. Secrets stay in .env.
# Permission lists per server:
#   allow_tools: allowlist of tool names; empty/omitted = allow all.
#   hitl_tools:  tools that require human-in-the-loop approval before running.
#   retry_tools: tools whose business operation is known to be retry-safe even
#                when the MCP server omits readOnlyHint/idempotentHint.
#   read_timeout_seconds: MCP SDK request deadline passed through the adapter's
#                official ClientSession session_kwargs. Never leave remote calls unbounded.
#   timeout:      HTTP/SSE connection timeout; unsupported for stdio.
#   headers:     only for http/sse/streamable_http MCP transports, e.g.
#                Authorization: ${MCP_BASIC_AUTH_HEADER}
mcpServers:
  kubernetes:
    required: true
    transport: stdio
    command: npx
    read_timeout_seconds: 60
    args:
      - -y
      - kubernetes-mcp-server@latest
      - --disable-multi-cluster
      - --kubeconfig
      - /path/to/kubeconfig-gardenlogin--cloud--shoot.yaml
    cwd: .
    allow_tools: []
    hitl_tools:
      - pods_delete
      - pods_exec
      - pods_run
      - resources_create_or_update
      - resources_delete
      - resources_scale
    retry_tools: []
    env:
      KUBECONFIG: /path/to/kubeconfig-gardenlogin--cloud--shoot.yaml
  # Jaeger 2.19+ has an official progressive-disclosure MCP extension.
  # Enable jaeger_mcp next to the query service and expose /mcp through the
  # authenticated reverse proxy; the official adapter owns each tool-call session.
  jaeger:
    required: true
    transport: streamable_http
    url: https://jaeger-otel.${OTEL_SHOOT_DOMAIN}/mcp
    timeout: 90
    read_timeout_seconds: 30
    headers:
      Authorization: ${MCP_BASIC_AUTH_HEADER}
    allow_tools: []
    hitl_tools: []
    retry_tools: []
  # Deploy the official prometheus/prometheus-mcp chart next to Prometheus and
  # expose /mcp through the authenticated reverse proxy.
  prometheus:
    required: true
    transport: streamable_http
    url: https://prometheus-otel.${OTEL_SHOOT_DOMAIN}/mcp
    timeout: 90
    read_timeout_seconds: 30
    headers:
      Authorization: ${MCP_BASIC_AUTH_HEADER}
    allow_tools: []
    hitl_tools: []
    retry_tools: []
  opensearch:
    required: true
    transport: stdio
    command: uvx
    args: ["opensearch-mcp-server-py@0.11.0", "--log-format", "json"]
    cwd: .
    read_timeout_seconds: 60
    allow_tools: []
    hitl_tools:
      - GenericOpenSearchApiTool
    retry_tools:
      - ListIndexTool
      - IndexMappingTool
      - SearchIndexTool
      - GetShardsTool
      - PPLQueryTool
    env:
      OPENSEARCH_URL: https://opensearch-otel.${OTEL_SHOOT_DOMAIN}
      OPENSEARCH_USERNAME: ${OTEL_BASIC_AUTH_USER}
      OPENSEARCH_PASSWORD: ${OTEL_BASIC_AUTH_PASSWORD}
      OPENSEARCH_ENABLED_TOOLS: ListIndexTool,IndexMappingTool,SearchIndexTool,GetShardsTool,GenericOpenSearchApiTool,PPLQueryTool
      OPENSEARCH_SETTINGS_ALLOW_WRITE: "false"
  # github: disabled by default; re-enable when a GitHub PAT is ready.
